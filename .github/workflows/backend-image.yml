name: Backend Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/yeodam-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image reference and digest
        run: |
          {
            echo "### Backend image"
            echo ""
            echo "\`deploy/image-versions.env\`에 넣을 값:"
            echo ""
            echo '```'
            echo "BACKEND_IMAGE=${IMAGE_NAME}:sha-${GITHUB_SHA}"
            echo "BACKEND_DIGEST=${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Cloud release manifest
        env:
          GH_TOKEN: ${{ secrets.CLOUD_RELEASE_TOKEN }}
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n \
            --arg component backend \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            '{
              event_type: "image-published",
              client_payload: {
                component: $component,
                source_repository: $source_repository,
                source_sha: $source_sha,
                image: $image,
                digest: $digest
              }
            }' |
            gh api \
              --method POST \
              repos/100-hours-a-week/KTB4-2nd-Cloud/dispatches \
              --input -
