name: Backend Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearsal:
        description: 'Build a rehearsal image without notifying the Cloud release manifest'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/yeodam-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select image reference
        id: image
        env:
          REHEARSAL: ${{ inputs.rehearsal || false }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" && "${REHEARSAL}" != "true" ]]; then
            echo "::error::Non-main image publishing requires rehearsal=true"
            exit 1
          fi

          if [[ "${REHEARSAL}" == "true" ]]; then
            echo "image=${IMAGE_NAME}:migration-probe-v2-sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "notify_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "image=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "notify_release=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image reference and digest
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "### Backend image"
            echo ""
            echo "Cloud V2 Manifest 후보 정보 (리허설 이미지는 알림 제외):"
            echo ""
            echo '```'
            echo "SOURCE_SHA=${GITHUB_SHA}"
            echo "BUILD_RUN_ID=${GITHUB_RUN_ID}"
            echo "BACKEND_IMAGE=${IMAGE}"
            echo "BACKEND_DIGEST=${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Cloud V2 release manifest
        if: ${{ github.ref == 'refs/heads/main' && steps.image.outputs.notify_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CLOUD_RELEASE_TOKEN }}
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          jq -n \
            --arg component backend \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg build_run_id "${GITHUB_RUN_ID}" \
            '{
              event_type: "v2-image-published",
              client_payload: {
                component: $component,
                source_repository: $source_repository,
                source_sha: $source_sha,
                image: $image,
                digest: $digest,
                build_run_id: $build_run_id
              }
            }' |
            gh api \
              --method POST \
              repos/100-hours-a-week/KTB4-2nd-Cloud/dispatches \
              --input -
