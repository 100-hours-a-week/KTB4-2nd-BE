name: Backend PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install image processing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends imagemagick libimage-exiftool-perl

      - name: Run tests, including MySQL migrations
        run: ./gradlew test --no-daemon --no-watch-fs

  image-build:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  backend-ci-gate:
    name: backend-ci-gate
    if: always()
    needs: [tests, image-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          IMAGE_BUILD_RESULT: ${{ needs['image-build'].result }}
        run: |
          if [[ "$TESTS_RESULT" != success || "$IMAGE_BUILD_RESULT" != success ]]; then
            echo "Backend tests: $TESTS_RESULT; image build: $IMAGE_BUILD_RESULT" >&2
            exit 1
          fi
