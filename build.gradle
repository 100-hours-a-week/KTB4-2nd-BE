plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yeodam'
version = '0.0.1-SNAPSHOT'
description = 'yeodam-be'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.sentry:sentry-spring-boot-4-starter:8.58.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'software.amazon.awssdk:s3:2.54.18'
    implementation 'software.amazon.awssdk:ec2:2.54.18'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Performance code is compiled and executed only by explicit tasks.
sourceSets {
    performanceTest {
        java.srcDir 'src/performanceTest/java'
        resources.srcDir 'src/performanceTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    performanceTestImplementation.extendsFrom testImplementation
    performanceTestRuntimeOnly.extendsFrom testRuntimeOnly
    performanceTestCompileOnly.extendsFrom testCompileOnly
    performanceTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}
tasks.named('test') {
    useJUnitPlatform { excludeTags 'performance' }
}
[
    authPerformanceServerTest: ['AuthPerformanceServerTest'],
    authPerformanceSupportTest: ['AuthMeasurementsTest', 'AuthCsrfFixtureTest'],
    derivativeK6ServerTest: ['DerivativeK6ServerTest', 'DerivativeK6PipelineTest'],
    performanceSupportTest: ['LocalAnalysisStubTest', 'StageMeasurementsTest', 'LoadReportTest', 'PostprocessLoadRunnerTest'],
    postprocessSmokeTest: ['PostprocessUploadSmokeTest'],
    postprocessLoadTest: ['PostprocessUploadLoadTest'],
    derivativeLoadTest: ['TripAttachmentDerivativeLoadTest'],
    placeProviderProbeTest: ['PlaceProviderFailureProbeTest']
].each { taskName, testClasses ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = 'Explicit performance verification; see performance/postprocess/README.md'
        testClassesDirs = sourceSets.performanceTest.output.classesDirs
        classpath = sourceSets.performanceTest.runtimeClasspath
        useJUnitPlatform {
            if (taskName in ['postprocessSmokeTest', 'postprocessLoadTest']) includeTags 'performance'
        }
        testClasses.each { include "**/${it}.class" }
        maxParallelForks = 1
        if (taskName == 'authPerformanceServerTest') {
            minHeapSize = '1g'
            maxHeapSize = '1g'
        }
        environment 'AWS_ACCESS_KEY_ID', 'test'
        environment 'AWS_SECRET_ACCESS_KEY', 'test'
        environment 'AWS_EC2_METADATA_DISABLED', 'true'
        outputs.upToDateWhen { false }
        project.properties.findAll { key, value -> key.startsWith('load.') }.each { key, value ->
            systemProperty key, value
        }
    }
}

// The launcher already exists in test runtime; expose it to the standalone harness.
dependencies { performanceTestImplementation 'org.junit.platform:junit-platform-launcher' }
tasks.register('authCapacityDistribution', Sync) {
    dependsOn tasks.named('performanceTestClasses')
    into layout.buildDirectory.dir('auth-capacity')
    from(sourceSets.main.output) { into 'classes' }
    from(sourceSets.performanceTest.output) { into 'classes' }
    from(configurations.performanceTestRuntimeClasspath) { into 'lib' }
    from('data') { into 'data' }
}
tasks.named('authCapacityDistribution') {
    doLast {
        def source = file('src/main/java/com/yeodam/yeodambe/user/security/session/LoginSessionStore.java')
        def csrfSource = file('src/main/java/com/yeodam/yeodambe/user/security/csrf/CsrfTokenStore.java')
        def metadata = [csrfStore: csrfSource.text.contains('StringRedisTemplate') ? 'redis' : 'rdb',
                        csrfSourceSha256: java.security.MessageDigest.getInstance('SHA-256').digest(csrfSource.bytes).encodeHex().toString(),
                        store: source.text.contains('StringRedisTemplate') ? 'redis' : 'rdb',
                        sourceCommit: file('auth-capacity-source.json').exists() ? new groovy.json.JsonSlurper().parse(file('auth-capacity-source.json')).commit : ['git', 'rev-parse', 'HEAD'].execute(null, projectDir).text.trim(),
                        sessionSourceSha256: java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()]
        file('build/auth-capacity/implementation.json').text = groovy.json.JsonOutput.toJson(metadata)
    }
}
