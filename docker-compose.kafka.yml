name: yeodam-kafka-local

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/yeodam/init-topics.sh"]
    command:
      - ${KAFKA_TRIP_CREATE_REQUEST_TOPIC:-local.yeodam.trip-create.request}
      - ${KAFKA_TRIP_CREATE_REQUEST_DLT_TOPIC:-${KAFKA_TRIP_CREATE_REQUEST_TOPIC:-local.yeodam.trip-create.request}-dlt}
      - ${KAFKA_TRIP_CREATE_RESULT_TOPIC:-local.yeodam.trip-create.result}
      - ${KAFKA_TRIP_CREATE_RESULT_DLT_TOPIC:-${KAFKA_TRIP_CREATE_RESULT_TOPIC:-local.yeodam.trip-create.result}-dlt}
      - ${KAFKA_TRIP_UPDATE_REQUEST_TOPIC:-local.yeodam.trip-update.request}
      - ${KAFKA_TRIP_UPDATE_REQUEST_DLT_TOPIC:-${KAFKA_TRIP_UPDATE_REQUEST_TOPIC:-local.yeodam.trip-update.request}-dlt}
      - ${KAFKA_TRIP_UPDATE_RESULT_TOPIC:-local.yeodam.trip-update.result}
      - ${KAFKA_TRIP_UPDATE_RESULT_DLT_TOPIC:-${KAFKA_TRIP_UPDATE_RESULT_TOPIC:-local.yeodam.trip-update.result}-dlt}
      - ${KAFKA_STORY_CREATE_REQUEST_TOPIC:-local.yeodam.story-create.request}
      - ${KAFKA_STORY_CREATE_REQUEST_DLT_TOPIC:-${KAFKA_STORY_CREATE_REQUEST_TOPIC:-local.yeodam.story-create.request}-dlt}
      - ${KAFKA_STORY_CREATE_RESULT_TOPIC:-local.yeodam.story-create.result}
      - ${KAFKA_STORY_CREATE_RESULT_DLT_TOPIC:-${KAFKA_STORY_CREATE_RESULT_TOPIC:-local.yeodam.story-create.result}-dlt}
    volumes:
      - ./kafka/init-topics.sh:/opt/yeodam/init-topics.sh:ro

volumes:
  kafka-data:
