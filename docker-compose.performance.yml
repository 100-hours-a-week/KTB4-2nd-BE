services:
  mysql:
    image: mysql:9.7
    container_name: yeodam-performance-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: yeodam
      MYSQL_USER: yeodam
      MYSQL_PASSWORD: yeodam
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - performance-mysql-data:/var/lib/mysql

  localstack:
    image: localstack/localstack:4.12
    container_name: yeodam-performance-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./performance/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

volumes:
  performance-mysql-data: