spring:
  application:
    name: yeodam-be
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 150MB
      file-size-threshold: 0B
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]

server:
  servlet:
    context-path: /api
  tomcat:
    max-part-count: 13

place:
  catalog:
    path: ${PLACE_CATALOG_PATH:./data/place-search-catalog.json}
    refresh-cron: ${PLACE_CATALOG_REFRESH_CRON:0 0 3 1 1,7 *}
    refresh-zone: ${PLACE_CATALOG_REFRESH_ZONE:Asia/Seoul}
  provider:
    base-url: ${DATA_GO_KR_LEGAL_DISTRICT_API_URL:}
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    timeout: ${DATA_GO_KR_TIMEOUT:3s}

kakao:
  local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    timeout: ${KAKAO_LOCAL_TIMEOUT:3s}
    max-concurrency: ${KAKAO_LOCAL_MAX_CONCURRENCY:5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
auth:
  jwt:
    audience: yeodam-api
    access-token-ttl: 30m

app:
  public-api-prefix: /api

aws:
  region: ${AWS_REGION:ap-northeast-2}

attachment:
  derivative:
    heic-workers: ${ATTACHMENT_DERIVATIVE_HEIC_WORKERS:1}
    light-workers: ${ATTACHMENT_DERIVATIVE_LIGHT_WORKERS:1}
    heic-max-inflight-photos: ${ATTACHMENT_DERIVATIVE_HEIC_MAX_INFLIGHT_PHOTOS:10}
    light-max-inflight-photos: ${ATTACHMENT_DERIVATIVE_LIGHT_MAX_INFLIGHT_PHOTOS:20}
  s3:
    bucket: ${ATTACHMENT_S3_BUCKET}
    read-url-ttl: ${ATTACHMENT_S3_READ_URL_TTL:10m}
    endpoint: ${ATTACHMENT_S3_ENDPOINT:}
    path-style: ${ATTACHMENT_S3_PATH_STYLE:false}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
    api-key: ${AI_SERVER_API_KEY}
    instance-id: ${AI_EC2_INSTANCE_ID}
    connection-timeout: ${AI_ANALYSIS_CONNECTION_TIMEOUT:10s}
    analysis_timeout: ${AI_ANALYSIS_READ_TIMEOUT:30m}
    health-connection-timeout: ${AI_HEALTH_CONNECTION_TIMEOUT:5s}
    health_read_timeout: ${AI_HEALTH_READ_TIMEOUT:5s}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:yeodam;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        yeodam.trip.stage: true

oauth:
  frontend-callback-uri: ${FRONTEND_OAUTH_CALLBACK_URI:http://localhost:5173/auth/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:local-client-id}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
    client-secret: ${KAKAO_CLIENT_SECRET:local-client-secret}
  browser-context-cookie:
    secure: false
auth:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-32-bytes}
    issuer: ${JWT_ISSUER:http://localhost:8080}
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: performance
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/yeodam?serverTimezone=Asia/Seoul&characterEncoding=utf8}
    username: ${MYSQL_USERNAME:yeodam}
    password: ${MYSQL_PASSWORD:yeodam}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        yeodam.trip.stage: true

attachment:
  s3:
    bucket: ${ATTACHMENT_S3_BUCKET:yeodam-performance}
    endpoint: ${ATTACHMENT_S3_ENDPOINT:http://localhost:4566}
    path-style: ${ATTACHMENT_S3_PATH_STYLE:true}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:9999}
    api-key: ${AI_SERVER_API_KEY:test}
    instance-id: ${AI_EC2_INSTANCE_ID:i-performance}

oauth:
  frontend-callback-uri: ${FRONTEND_OAUTH_CALLBACK_URI:http://localhost:5173/auth/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:local-client-id}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
    client-secret: ${KAKAO_CLIENT_SECRET:local-client-secret}
  browser-context-cookie:
    secure: false

auth:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-32-bytes}
    issuer: ${JWT_ISSUER:http://localhost:8080}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

logging:
  structured:
    format:
      console: com.yeodam.yeodambe.common.logging.BackendJsonLogFormatter

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  release: ${RELEASE:unknown}
  send-default-pii: false

oauth:
  frontend-callback-uri: ${FRONTEND_OAUTH_CALLBACK_URI}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET}
  browser-context-cookie:
    secure: true
auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
app:
  public-api-prefix: /api
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}
---
spring:
  config:
    activate:
      on-profile: test

place:
  provider:
    base-url: http://localhost:9999/regions
    service-key: test
    timeout: 1s

ai:
  server:
    base-url: http://localhost:9999
    api-key: test
    instance-id: i-test
attachment:
  s3:
    bucket: test-bucket

oauth:
  frontend-callback-uri: https://app.yeodam.test/auth/callback
  kakao:
    client-id: test-client-id
    redirect-uri: https://api.yeodam.test/auth/kakao/callback
    client-secret: test-client-secret
  browser-context-cookie:
    secure: false
auth:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-bytes
    issuer: https://api.yeodam.test
app:
  cors:
    allowed-origin: https://app.yeodam.test
