spring:
  application:
    name: yeodam-be
  profiles:
    default: local

---
spring:
  config:
    activate:
      on-profile: local | test
  datasource:
    url: jdbc:h2:mem:yeodam;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
