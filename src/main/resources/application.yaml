spring:
  application:
    name: yeodam-be
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:yeodam;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:local-client-id}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI}

---
spring:
  config:
    activate:
      on-profile: test

oauth:
  kakao:
    client-id: test-client-id
    redirect-uri: https://api.yeodam.test/auth/kakao/callback
