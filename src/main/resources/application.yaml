spring:
  application:
    name: yeodam-be
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: PLAINTEXT
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: lz4
      acks: all
      properties:
        "[enable.idempotence]": true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        "[allow.auto.create.topics]": false
    listener:
      ack-mode: record
  task:
    scheduling:
      pool:
        size: 4
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  profiles:
    default: local
  config:
    import: optional:file:${DOTENV_PATH:.env}[.properties]

server:
  servlet:
    context-path: /api

place:
  catalog:
    path: ${PLACE_CATALOG_PATH:./data/place-search-catalog.json}
    refresh-cron: ${PLACE_CATALOG_REFRESH_CRON:0 0 3 1 1,7 *}
    refresh-zone: ${PLACE_CATALOG_REFRESH_ZONE:Asia/Seoul}
  provider:
    base-url: ${DATA_GO_KR_LEGAL_DISTRICT_API_URL:}
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    timeout: ${DATA_GO_KR_TIMEOUT:3s}

kakao:
  local:
    base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
    timeout: ${KAKAO_LOCAL_TIMEOUT:3s}
    max-concurrency: ${KAKAO_LOCAL_MAX_CONCURRENCY:5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
auth:
  session:
    key-prefix: ${AUTH_SESSION_KEY_PREFIX:yeodam:local:auth:}
  jwt:
    audience: yeodam-api
    access-token-ttl: 30m

app:
  outbox:
    receipt-consumer-group: ${KAFKA_OUTBOX_RECEIPT_CONSUMER_GROUP:yeodam-outbox-receipts}
  public-api-prefix: /api
  story:
    status-polling-enabled: ${STORY_STATUS_POLLING_ENABLED:true}
    result-listener-enabled: ${STORY_RESULT_LISTENER_ENABLED:true}
    result-consumer-group: ${KAFKA_STORY_RESULT_CONSUMER_GROUP:yeodam-story-results}
  kafka:
    topics:
      trip-create-request: ${KAFKA_TRIP_CREATE_REQUEST_TOPIC:local.yeodam.trip-create.request}
      trip-create-result: ${KAFKA_TRIP_CREATE_RESULT_TOPIC:local.yeodam.trip-create.result}
      trip-update-request: ${KAFKA_TRIP_UPDATE_REQUEST_TOPIC:local.yeodam.trip-update.request}
      trip-update-result: ${KAFKA_TRIP_UPDATE_RESULT_TOPIC:local.yeodam.trip-update.result}
      story-create-request: ${KAFKA_STORY_CREATE_REQUEST_TOPIC:local.yeodam.story-create.request}
      story-create-result: ${KAFKA_STORY_CREATE_RESULT_TOPIC:local.yeodam.story-create.result}
    dead-letter-topics:
      trip-create-request: ${KAFKA_TRIP_CREATE_REQUEST_DLT_TOPIC:${app.kafka.topics.trip-create-request}-dlt}
      trip-create-result: ${KAFKA_TRIP_CREATE_RESULT_DLT_TOPIC:${app.kafka.topics.trip-create-result}-dlt}
      trip-update-request: ${KAFKA_TRIP_UPDATE_REQUEST_DLT_TOPIC:${app.kafka.topics.trip-update-request}-dlt}
      trip-update-result: ${KAFKA_TRIP_UPDATE_RESULT_DLT_TOPIC:${app.kafka.topics.trip-update-result}-dlt}
      story-create-request: ${KAFKA_STORY_CREATE_REQUEST_DLT_TOPIC:${app.kafka.topics.story-create-request}-dlt}
      story-create-result: ${KAFKA_STORY_CREATE_RESULT_DLT_TOPIC:${app.kafka.topics.story-create-result}-dlt}

aws:
  region: ${AWS_REGION:ap-northeast-2}

attachment:
  derivative:
    heic-workers: ${ATTACHMENT_DERIVATIVE_HEIC_WORKERS:1}
    light-workers: ${ATTACHMENT_DERIVATIVE_LIGHT_WORKERS:1}
    heic-max-inflight-photos: ${ATTACHMENT_DERIVATIVE_HEIC_MAX_INFLIGHT_PHOTOS:50}
    light-max-inflight-photos: ${ATTACHMENT_DERIVATIVE_LIGHT_MAX_INFLIGHT_PHOTOS:100}
  s3:
    bucket: ${ATTACHMENT_S3_BUCKET}
    read-url-ttl: ${ATTACHMENT_S3_READ_URL_TTL:10m}
    endpoint: ${ATTACHMENT_S3_ENDPOINT:}
    path-style: ${ATTACHMENT_S3_PATH_STYLE:false}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
    api-key: ${AI_SERVER_API_KEY}
    instance-id: ${AI_EC2_INSTANCE_ID}
    connection-timeout: ${AI_ANALYSIS_CONNECTION_TIMEOUT:10s}
    analysis_timeout: ${AI_ANALYSIS_READ_TIMEOUT:30m}
    query-connection-timeout: ${AI_QUERY_CONNECTION_TIMEOUT:5s}
    query-read-timeout: ${AI_QUERY_READ_TIMEOUT:30s}
    story-connection-timeout: ${AI_STORY_CONNECTION_TIMEOUT:5s}
    story-read-timeout: ${AI_STORY_READ_TIMEOUT:5s}
    runpod-status-connection-timeout: ${AI_RUNPOD_STATUS_CONNECTION_TIMEOUT:10s}
    runpod-status-read-timeout: ${AI_RUNPOD_STATUS_READ_TIMEOUT:5s}
    health-connection-timeout: ${AI_HEALTH_CONNECTION_TIMEOUT:5s}
    health_read_timeout: ${AI_HEALTH_READ_TIMEOUT:5s}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:yeodam;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        yeodam.trip.stage: true

oauth:
  frontend-callback-uri: ${FRONTEND_OAUTH_CALLBACK_URI:http://localhost:5173/auth/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:local-client-id}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
    client-secret: ${KAKAO_CLIENT_SECRET:local-client-secret}
  browser-context-cookie:
    secure: false
auth:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-32-bytes}
    issuer: ${JWT_ISSUER:http://localhost:8080}
app:
  trip:
    result-listener-enabled: ${KAFKA_TRIP_RESULT_LISTENER_ENABLED:true}
    result-consumer-group: ${KAFKA_TRIP_RESULT_CONSUMER_GROUP:yeodam-trip-results}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: performance
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/yeodam?serverTimezone=Asia/Seoul&characterEncoding=utf8}
    username: ${MYSQL_USERNAME:yeodam}
    password: ${MYSQL_PASSWORD:yeodam}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        yeodam.trip.stage: true

attachment:
  s3:
    bucket: ${ATTACHMENT_S3_BUCKET:yeodam-performance}
    endpoint: ${ATTACHMENT_S3_ENDPOINT:http://localhost:4566}
    path-style: ${ATTACHMENT_S3_PATH_STYLE:true}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:9999}
    api-key: ${AI_SERVER_API_KEY:test}
    instance-id: ${AI_EC2_INSTANCE_ID:i-performance}

oauth:
  frontend-callback-uri: ${FRONTEND_OAUTH_CALLBACK_URI:http://localhost:5173/auth/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:local-client-id}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
    client-secret: ${KAKAO_CLIENT_SECRET:local-client-secret}
  browser-context-cookie:
    secure: false

auth:
  session:
    key-prefix: ${AUTH_SESSION_KEY_PREFIX:yeodam:performance:auth:}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-32-bytes}
    issuer: ${JWT_ISSUER:http://localhost:8080}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

logging:
  structured:
    format:
      console: com.yeodam.yeodambe.common.logging.BackendJsonLogFormatter

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  release: ${RELEASE:unknown}
  send-default-pii: false

oauth:
  frontend-callback-uri: ${FRONTEND_OAUTH_CALLBACK_URI}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET}
  browser-context-cookie:
    secure: true
auth:
  session:
    key-prefix: ${AUTH_SESSION_KEY_PREFIX:yeodam:prod:auth:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
app:
  outbox:
    receipt-consumer-group: ${KAFKA_OUTBOX_RECEIPT_CONSUMER_GROUP:yeodam-outbox-receipts}
  public-api-prefix: /api
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}
---
spring:
  config:
    activate:
      on-profile: test

place:
  provider:
    base-url: http://localhost:9999/regions
    service-key: test
    timeout: 1s

ai:
  server:
    base-url: http://localhost:9999
    api-key: test
    instance-id: i-test
attachment:
  s3:
    bucket: test-bucket

oauth:
  frontend-callback-uri: https://app.yeodam.test/auth/callback
  kakao:
    client-id: test-client-id
    redirect-uri: https://api.yeodam.test/auth/kakao/callback
    client-secret: test-client-secret
  browser-context-cookie:
    secure: false
auth:
  session:
    key-prefix: "yeodam:test:auth:"
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-bytes
    issuer: https://api.yeodam.test
app:
  outbox:
    receipt-listener-enabled: false
  cors:
    allowed-origin: https://app.yeodam.test
  trip:
    worker-initial-delay-ms: 3600000
    result-listener-enabled: false
  story:
    status-polling-enabled: false
    result-listener-enabled: false
  kafka:
    topics:
      trip-create-request: test.yeodam.trip-create.request
      trip-create-result: test.yeodam.trip-create.result
      trip-update-request: test.yeodam.trip-update.request
      trip-update-result: test.yeodam.trip-update.result
      story-create-request: test.yeodam.story-create.request
      story-create-result: test.yeodam.story-create.result
