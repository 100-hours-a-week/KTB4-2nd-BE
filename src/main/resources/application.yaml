spring:
  application:
    name: yeodam-be
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]

place:
  provider:
    base-url: ${DATA_GO_KR_LEGAL_DISTRICT_API_URL:https://apis.data.go.kr/1741000/StanReginCd/getStanReginCdList}
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    timeout: ${DATA_GO_KR_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:yeodam;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
