spring:
  application:
    name: yeodam-be
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]

place:
  provider:
    base-url: ${DATA_GO_KR_LEGAL_DISTRICT_API_URL:https://apis.data.go.kr/1741000/StanReginCd/getStanReginCdList}
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    timeout: ${DATA_GO_KR_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:yeodam;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:local-client-id}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}
    client-secret: ${KAKAO_CLIENT_SECRET:local-client-secret}
  browser-context-cookie:
    secure: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET}
  browser-context-cookie:
    secure: true

---
spring:
  config:
    activate:
      on-profile: test

oauth:
  kakao:
    client-id: test-client-id
    redirect-uri: https://api.yeodam.test/auth/kakao/callback
    client-secret: test-client-secret
  browser-context-cookie:
    secure: false
