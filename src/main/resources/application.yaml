spring:
  application:
    name: yeodam-be
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 3GB
      file-size-threshold: 0B
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]

server:
  tomcat:
    max-part-count: 200

place:
  provider:
    base-url: ${DATA_GO_KR_LEGAL_DISTRICT_API_URL:https://apis.data.go.kr/1741000/StanReginCd/getStanReginCdList}
    service-key: ${DATA_GO_KR_SERVICE_KEY:}
    timeout: ${DATA_GO_KR_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
auth:
  jwt:
    audience: yeodam-api
    access-token-ttl: 30m

aws:
  region: ${AWS_REGION:ap-northeast-2}

attachment:
  s3:
    bucket: ${ATTACHMENT_S3_BUCKET}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
    api-key: ${AI_SERVER_API_KEY}
    instance-id: ${AI_EC2_INSTANCE_ID}
    connection-timeout: ${AI_CONNECTION_TIMEOUT:10s}
    analysis_timeout: ${AI_ANALYSIS_TIMEOUT:30m}
    health-connection-timeout: ${AI_HEALTH_CONNECTION_TIMEOUT:5s}
    health_read_timeout: ${AI_HEALTH_READ_TIMEOUT:5s}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:yeodam;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

oauth:
  frontend-callback-uri: ${FRONTEND_OAUTH_CALLBACK_URI:http://localhost:5173/auth/callback}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:local-client-id}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}
    client-secret: ${KAKAO_CLIENT_SECRET:local-client-secret}
  browser-context-cookie:
    secure: false
auth:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-32-bytes}
    issuer: ${JWT_ISSUER:http://localhost:8080}
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}


oauth:
  frontend-callback-uri: ${FRONTEND_OAUTH_CALLBACK_URI}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    client-secret: ${KAKAO_CLIENT_SECRET}
  browser-context-cookie:
    secure: true
auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}
---
spring:
  config:
    activate:
      on-profile: test

ai:
  server:
    base-url: http://localhost:9999
    api-key: test
    instance-id: i-test
attachment:
  s3:
    bucket: test-bucket

oauth:
  frontend-callback-uri: https://app.yeodam.test/auth/callback
  kakao:
    client-id: test-client-id
    redirect-uri: https://api.yeodam.test/auth/kakao/callback
    client-secret: test-client-secret
  browser-context-cookie:
    secure: false
auth:
  jwt:
    secret: test-jwt-secret-key-must-be-at-least-32-bytes
    issuer: https://api.yeodam.test
app:
  cors:
    allowed-origin: https://app.yeodam.test
