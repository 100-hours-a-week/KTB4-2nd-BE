spring:
  application:
    name: yeodam-websocket
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redisSubscription

websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}
  events:
    channel: ${WEBSOCKET_EVENTS_CHANNEL:yeodam:local:websocket:events:v1}
  backend-auth:
    base-url: ${BACKEND_INTERNAL_BASE_URL:http://localhost:8080}
    service-token: ${WEBSOCKET_INTERNAL_SERVICE_TOKEN:}
    connect-timeout: 1s
    read-timeout: 2s
