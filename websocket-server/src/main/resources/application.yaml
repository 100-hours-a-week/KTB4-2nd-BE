spring:
  application:
    name: yeodam-websocket

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

websocket:
  backend-auth:
    base-url: ${BACKEND_INTERNAL_BASE_URL:http://localhost:8080}
    service-token: ${WEBSOCKET_INTERNAL_SERVICE_TOKEN:}
    connect-timeout: 1s
    read-timeout: 2s
